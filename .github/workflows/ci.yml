name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - name: Install (CPU PyTorch is enough for the tests)
        run: |
          pip install torch torchvision --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-train.txt
      - run: ruff check .
      - name: Tests (no dataset or GPU needed)
        run: pytest -q

  docker:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check the model release exists
        id: release
        run: |
          if curl -sfIL "https://github.com/${GITHUB_REPOSITORY}/releases/download/v1.0.0/models_onnx.zip" >/dev/null; then
            echo "exists=true" >> "$GITHUB_OUTPUT"
          else
            echo "No model release yet; skipping the image build."
          fi
      - name: Build serving image with the released models
        if: steps.release.outputs.exists == 'true'
        run: docker build -t defect-inspection .
      - name: Smoke test the API
        if: steps.release.outputs.exists == 'true'
        run: |
          docker run -d -p 8000:8000 --name svc defect-inspection
          for i in $(seq 1 30); do curl -sf localhost:8000/api/health && break; sleep 2; done
          curl -sf localhost:8000/api/categories
          python3 -c "import numpy, PIL" 2>/dev/null || pip install numpy pillow
          python3 -c "from PIL import Image; import numpy as np; Image.fromarray(np.random.default_rng(0).integers(0,255,(256,256,3),dtype=np.uint8)).save('x.png')"
          curl -sf -F file=@x.png -F category=bottle -F method=patchcore localhost:8000/api/inspect | python3 -c "import json,sys; d=json.load(sys.stdin); print(d['verdict'], d['score']); assert d['verdict'] in ('pass','fail')"
